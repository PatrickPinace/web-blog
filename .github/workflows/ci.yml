name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  # Testy bezpieczeństwa w osobnym jobie, żeby ich wynik nie ginął w szumie
  # reszty testów (plan, sekcja 8) — czerwony na tym jobie znaczy więcej
  # niż czerwony gdziekolwiek indziej.
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/security -v
        env:
          SECRET_KEY: ci-test-secret-key
          DATABASE_URL: "sqlite://"
          TEST_DATABASE_URL: "sqlite://"

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blog
          POSTGRES_PASSWORD: blog
          POSTGRES_DB: blog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v
        env:
          SECRET_KEY: ci-test-secret-key
          DATABASE_URL: "postgresql+psycopg://blog:blog@localhost:5432/blog_test"
          TEST_DATABASE_URL: "postgresql+psycopg://blog:blog@localhost:5432/blog_test"
